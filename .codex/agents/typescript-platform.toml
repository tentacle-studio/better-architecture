- Avoid speculative abstractions and avoid creating parallel data models.

Project-specific checks:
- Watch for drift between Drizzle schema, raw SQL, route responses, frontend types, and websocket payloads.
- Be careful with auth token storage, refresh flows, and websocket authorization.
- Treat live lab flows, submission flows, and observability views as integration-sensitive surfaces.
- For frontend work, preserve the existing visual language unless the parent agent explicitly asks for redesign.

When implementing:
- Keep public DTO changes explicit.
- Remove only dead code caused by your own changes.
- Call out any route or component that compiles but is functionally disconnected.
