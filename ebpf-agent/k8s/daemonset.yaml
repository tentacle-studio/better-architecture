apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: ebpf-agent
  namespace: kube-system
  labels:
    app: ebpf-agent
spec:
  selector:
    matchLabels:
      app: ebpf-agent
  template:
    metadata:
      labels:
        app: ebpf-agent
    spec:
      serviceAccountName: ebpf-agent
      hostPID: true        # Required to read host cgroup/PID namespaces
      hostNetwork: false   # Agent uses K8s pod IPs, not host networking
      tolerations:
        - operator: Exists  # Schedule on all nodes including control-plane

      containers:
        - name: ebpf-agent
          image: ghcr.io/better-architecture/ebpf-agent:latest
          imagePullPolicy: Always
          env:
            - name: NATS_URL
              value: "nats://nats.nats.svc.cluster.local:4222"
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: PUBLISH_INTERVAL_MS
              value: "50"
          securityContext:
            privileged: false
            capabilities:
              add:
                - BPF          # Load and attach BPF programs
                - NET_ADMIN    # Required for tc/xdp attachment (future-proof)
                - SYS_PTRACE   # CO-RE BTF type resolution
              drop:
                - ALL
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          volumeMounts:
            - name: sys-fs-bpf
              mountPath: /sys/fs/bpf
            - name: debugfs
              mountPath: /sys/kernel/debug
              readOnly: true

      volumes:
        - name: sys-fs-bpf
          hostPath:
            path: /sys/fs/bpf
            type: DirectoryOrCreate
        - name: debugfs
          hostPath:
            path: /sys/kernel/debug

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ebpf-agent
  namespace: kube-system

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ebpf-agent
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "watch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ebpf-agent
subjects:
  - kind: ServiceAccount
    name: ebpf-agent
    namespace: kube-system
roleRef:
  kind: ClusterRole
  name: ebpf-agent
  apiGroup: rbac.authorization.k8s.io
