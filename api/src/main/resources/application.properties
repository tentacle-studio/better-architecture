spring.application.name=BetterArchitecture

# Server Configuration
server.port=8080

# WebSocket Configuration
spring.websocket.message-size-limit=512000
spring.websocket.send-time-limit=20000
spring.websocket.send-buffer-size-limit=512000

# CORS Configuration
spring.web.cors.allowed-origins=http://localhost:5173,http://localhost:3000
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=true

# Logging
logging.level.ocean.studio=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.springframework.messaging=INFO
